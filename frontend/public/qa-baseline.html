<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABO browser pacing baseline</title>
<style>body{font:14px Arial,sans-serif;max-width:900px;margin:24px auto;padding:16px;background:#f2f6fc;color:#142b49}button{font:inherit;min-height:44px;padding:8px 16px;background:#195cc2;color:white;border:0;border-radius:6px}canvas{display:block;width:600px;max-width:100%;height:300px;background:#dce5ef;margin:16px 0}pre{overflow:auto;max-height:250px;white-space:pre-wrap}button:focus-visible{outline:3px solid #142b49;outline-offset:3px}</style>
<h1>Animation and empty WebGL baseline</h1><p>This diagnostic records browser scheduling with one animation callback and one empty WebGL clear per frame. It contains no React, terrain, particles, or simulation solver.</p><button id="start">Record 10-second baseline</button><button id="download" disabled>Download baseline JSON</button><canvas aria-label="Empty blue WebGL baseline"></canvas><p id="status" role="status">Ready. Keep this browser window in the foreground.</p><pre id="evidence"></pre>
<script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2'),button=document.querySelector('button'),status=document.querySelector('#status'),output=document.querySelector('#evidence');
button.onclick=()=>{button.disabled=true;const times=[],rendered=[],started=performance.now();status.textContent='Recording foreground pacing for 10 seconds.';function tick(now){times.push(now);if(gl){gl.clearColor(.86,.9,.94,1);gl.clear(gl.COLOR_BUFFER_BIT);rendered.push(performance.now());}if(now-started<10000)requestAnimationFrame(tick);else{const evidence={started,finished:now,callbacks:times,rendered,webgl2:Boolean(gl),hidden:document.hidden,hasFocus:document.hasFocus(),viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,userAgent:navigator.userAgent};output.textContent=JSON.stringify(evidence);output.dataset.evidence=output.textContent;status.textContent=`Complete: ${times.length} callbacks, ${rendered.length} WebGL clears.`;button.disabled=false;}}requestAnimationFrame(tick);};
document.querySelector('#download').onclick=()=>{const blob=new Blob([output.textContent],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='abo-baseline-timing.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};new MutationObserver(()=>{document.querySelector('#download').disabled=!output.textContent;}).observe(output,{childList:true});
</script></html>
